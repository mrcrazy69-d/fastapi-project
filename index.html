<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Users & Tasks Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      background-color: #f0f2f5;
    }
    .sidebar {
      width: 220px;
      background-color: #fff;
      padding: 1rem;
      height: 100vh;
      box-shadow: 2px 0 6px rgba(0,0,0,0.1);
    }
    .sidebar button {
      display: block;
      width: 100%;
      margin-bottom: 1rem;
      padding: 0.75rem;
      background-color: #007bff;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .main {
      flex: 1;
      padding: 2rem;
    }
    .card {
      display: none;
      background-color: #fff;
      padding: 1.5rem;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
    .card.active {
      display: block;
    }
    h2 {
      text-align: center;
      margin-bottom: 1.5rem;
      color: #333;
    }
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .controls input {
      flex: 1;
      padding: 0.6rem;
      margin-right: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    .controls button {
      padding: 0.6rem 1rem;
      background-color: #007bff;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    form#createUserForm {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    form#createUserForm input {
      flex: 1;
      padding: 0.6rem;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 0.75rem;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }
    th {
      background-color: #f9fafc;
    }
    .delete-btn {
      background-color: crimson;
      color: #fff;
      padding: 0.4rem 0.7rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .scroll-wrapper {
      overflow-y: auto;
      max-height: 500px;
    }
#aiCard {
  flex-direction: column;
  align-items: center;
  max-width: 800px;
  margin: 0 auto;
}
#aiCard.card.active {
  display: flex;
  flex-direction: column;
  align-items: center;
}

    #aiCard input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    #aiCard > div {
      width: 100%;
    }
    #aiResponse {
      white-space: pre-wrap;
      background: #fefefe;
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 1rem;
      margin-top: 1rem;
      min-height: 150px;
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <button onclick="showCard('users')">Users</button>
    <button onclick="showCard('tasks')">Tasks</button>
    <button onclick="showCard('ai')">Ask AI Agent</button>
  </div>

  <div class="main">

    <!-- Users -->
    <div class="card" id="usersCard">
      <h2>Users</h2>
      <form id="createUserForm" onsubmit="submitUser(event)">
        <input id="userName" type="text" placeholder="Name" required />
        <input id="userEmail" type="email" placeholder="Email" required />
        <button type="submit">Add</button>
      </form>
      <div class="controls">
        <input id="searchUser" type="text" placeholder="Search user…" oninput="filterUsers()" />
        <button onclick="fetchUsers()">Refresh</button>
      </div>
      <div class="scroll-wrapper">
        <table>
          <thead>
            <tr>
              <th>User ID</th>
              <th>Username</th>
              <th>Email</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="usersTable"></tbody>
        </table>
      </div>
    </div>

    <!-- Tasks -->
    <div class="card" id="tasksCard">
      <h2>Tasks</h2>
      <div class="controls">
        <button onclick="fetchTasks()">All Tasks</button>
       
      </div>
      <div class="scroll-wrapper">
        <table>
          <thead>
            <tr>
              <th>Task ID</th>
              <th>Title</th>
              <th>Status</th>
              <th>User ID</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="tasksTable"></tbody>
        </table>
      </div>
    </div>

    <!-- AI Agent -->
    <div class="card" id="aiCard">
      <h2>Ask AI Agent</h2>
      <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem; width: 100%;">
        <input id="aiQuery" type="text" placeholder="Ask about users or tasks..." />
        <button onclick="askAgent()">Ask</button>
      </div>
      <div id="aiResponse"></div>
    </div>

  </div>

  <script>
    const API = 'http://127.0.0.1:8000';
    let cacheUsers = [];

    function showCard(type) {
      document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
      document.getElementById(type + 'Card').classList.add('active');
    }

    async function fetchUsers() {
      try {
        const res = await fetch(`${API}/users`, {
          headers: { Authorization: 'Basic ' + btoa('admin:pass123') }
        });
        cacheUsers = await res.json();
        renderUsers(cacheUsers);
      } catch (err) {
        alert("Error fetching users: " + err.message);
      }
    }

    async function fetchTasks() {
      try {
        const res = await fetch(`${API}/tasks`);
        const data = await res.json();
        renderTasks(data);
      } catch (err) {
        alert("Error fetching tasks: " + err.message);
      }
    }

    async function fetchPendingTasks() {
      try {
        const res = await fetch(`${API}/tasks/status/pending`);
        const data = await res.json();
        renderTasks(data);
      } catch (err) {
        alert("Error fetching pending tasks: " + err.message);
      }
    }

    function renderUsers(users) {
      const tbody = document.getElementById('usersTable');
      tbody.innerHTML = '';
      users.forEach(u => {
        const row = `<tr><td>${u.id}</td><td>${u.name}</td><td>${u.email}</td>
          <td><button class="delete-btn" onclick="deleteUser(${u.id})">Del</button></td></tr>`;
        tbody.innerHTML += row;
      });
    }

    function renderTasks(tasks) {
      const tbody = document.getElementById('tasksTable');
      tbody.innerHTML = '';
      tasks.forEach(t => {
        const row = `<tr><td>${t.id}</td><td>${t.title}</td><td>${t.status}</td><td>${t.user_id}</td>
          <td><button class="delete-btn" onclick="deleteTask(${t.id})">Del</button></td></tr>`;
        tbody.innerHTML += row;
      });
    }

    function filterUsers() {
      const q = document.getElementById('searchUser').value.toLowerCase();
      const filtered = cacheUsers.filter(u => u.name.toLowerCase().includes(q));
      renderUsers(filtered);
    }

    function submitUser(event) {
      event.preventDefault();
      const name = document.getElementById('userName').value.trim();
      const email = document.getElementById('userEmail').value.trim();

      fetch(`${API}/users`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email })
      })
      .then(res => {
        if (!res.ok) throw new Error("Failed to create user");
        return res.json();
      })
      .then(() => {
        document.getElementById('createUserForm').reset();
        fetchUsers();
      })
      .catch(err => alert(err));
    }

    async function deleteUser(id) {
      await fetch(`${API}/users/${id}`, { method: 'DELETE' });
      fetchUsers();
      fetchTasks();
    }

    async function deleteTask(id) {
      if (!confirm(`Delete task ${id}?`)) return;

      const res = await fetch(`${API}/tasks/${id}`, {
        method: "DELETE",
        headers: { Authorization: "Basic " + btoa("admin:pass123") }
      });

      if (res.status === 204) {
        alert("Task deleted!");
        fetchTasks();
      } else {
        alert("Failed to delete task");
      }
    }

    async function askAgent() {
  const query = document.getElementById("aiQuery").value.trim();
  const responseDiv = document.getElementById("aiResponse");

  if (!query) return responseDiv.innerText = "Please enter a question.";

  responseDiv.innerText = "Thinking...";

  try {
    const res = await fetch("http://127.0.0.1:8001/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query })
    });

    const data = await res.json();
    console.log("[Agent Response]", data); // ✅ Debug
    const answer = data.response ?? data.error ?? "⚠️ No response received";
    responseDiv.innerText = answer;
  } catch (err) {
    responseDiv.innerText = "⚠️ Error contacting agent: " + err.message;
  }
}


    // Initialize
    showCard('users');
    fetchUsers();
    fetchTasks();
  </script>

</body>
</html>
